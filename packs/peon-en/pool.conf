# peon-en — Warcraft III Orc Peon voice lines, English original.
# Source: Warcraft III (Blizzard) — peon unit responses, EN.
# Segmented by hand from a single voice clip; mapped to events by meaning.
# Event mapping mirrors peon-pl (Polish pack) line-for-line where an English
# equivalent exists.
#
# Note: the peon has no real "task finished" lines — they're order-acknowledgments
# (spoken when you COMMAND it). So acceptance/eager lines live on SESSION (start of
# work), and STOP uses the "back to ready" line (Ready to work! / Yes).

POOL_SESSION=(
  04_What_do_you_want.mp3
  13_What.mp3
  05_Work_work.mp3
  09_Okay.mp3
  02_Be_happy_to.mp3
  03_Something_need_doing.mp3
  01_I_can_do_that.mp3
  12_Ill_try.mp3
  11_Get_them.mp3
)

POOL_STOP=(
  07_Ready_to_work.mp3
  10_Yes.mp3
)

POOL_NOTIFICATION=(
